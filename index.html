<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSU 学习导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: 40px 20px;
    color: #333;
  }
  .header { text-align: center; margin-bottom: 40px; color: #fff; }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header p { opacity: 0.8; font-size: 14px; }

  .search-box {
    max-width: 500px; margin: 0 auto 32px;
    display: flex; gap: 8px;
  }
  .search-box input {
    flex: 1; padding: 12px 16px; border: none; border-radius: 10px;
    font-size: 15px; outline: none;
  }

  .grid {
    max-width: 900px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 20px;
    text-decoration: none; color: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transition: transform .2s, box-shadow .2s;
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .card .icon { font-size: 28px; }
  .card .name { font-size: 17px; font-weight: 600; }
  .card .desc { font-size: 13px; color: #888; }
  .card .fav {
    position: absolute; top: 14px; right: 14px;
    font-size: 16px; opacity: 0.25; cursor: pointer;
    transition: opacity .2s, transform .2s;
  }
  .card .fav:hover { transform: scale(1.2); }
  .card .fav.active { opacity: 1; }

  .empty {
    text-align: center; color: #fff; opacity: 0.7;
    padding: 40px; grid-column: 1/-1;
  }
  .footer {
    text-align: center; color: rgba(255,255,255,0.6);
    font-size: 12px; margin-top: 40px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🎓 SYSU 学习导航</h1>
  <p>常用系统一站直达 · 点击卡片打开</p>
</div>

<div class="search-box">
  <input type="text" id="search" placeholder="搜索系统名称…">
</div>

<div class="grid" id="grid"></div>

<div class="footer">仅供同学间学习交流使用</div>

<script>
const sites = [
  { name: "中大统一门户",   url: "https://mportal.sysu.edu.cn/mobilePortal/#/login", icon: "🏛️", desc: "统一身份认证 / 综合入口" },
  { name: "中大教务系统",   url: "https://jwxt.sysu.edu.cn/jwxt/#/login", icon: "📚", desc: "选课 / 成绩 / 学籍" },
  { name: "中大图书馆",     url: "https://library.sysu.edu.cn",           icon: "📖", desc: "馆藏查询 / 借阅 / 数据库" },
  { name: "逸仙智课",       url: "https://aic.sysu.edu.cn/",              icon: "🎥", desc: "在线课程平台" },
  { name: "seelight",       url: "http://test.seelight.net/",             icon: "📝", desc: "物理实验作业提交处" },
  { name: "爱物理",         url: "http://lovephysics.sysu.edu.cn/doku.php", icon: "📄", desc: "大学实验报告文档查看处" },
  { name: "头歌平台",       url: "http://172.25.70.126/",                 icon: "💻", desc: "校内编程平台（需校园网）" },
  { name: "Microsoft工具下载", url: "https://ms.sysu.edu.cn/",            icon: "🔧", desc: "Office / 正版软件（需校园网）" },
];

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');

// 收藏（存在浏览器本地）
let favs = JSON.parse(localStorage.getItem('sysu_favs') || '[]');

function render(keyword = '') {
  const kw = keyword.trim().toLowerCase();
  const filtered = sites.filter(s =>
    s.name.toLowerCase().includes(kw) || s.desc.toLowerCase().includes(kw)
  );

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">没有找到相关系统</div>';
    return;
  }

  grid.innerHTML = filtered.map(s => `
    <a class="card" href="${s.url}" target="_blank" rel="noopener">
      <span class="fav ${favs.includes(s.name) ? 'active' : ''}" data-name="${s.name}">★</span>
      <div class="icon">${s.icon}</div>
      <div class="name">${s.name}</div>
      <div class="desc">${s.desc}</div>
    </a>
  `).join('');

  // 收藏点击
  grid.querySelectorAll('.fav').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const n = el.dataset.name;
      if (favs.includes(n)) favs = favs.filter(x => x !== n);
      else favs.push(n);
      localStorage.setItem('sysu_favs', JSON.stringify(favs));
      render(searchInput.value);
    });
  });
}

searchInput.addEventListener('input', e => render(e.target.value));
render();
</script>

</body>
</html>
